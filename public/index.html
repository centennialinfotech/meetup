<!DOCTYPE html>
<html>
<head>
  <title>Event Search</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    h2 {
      text-align: center;
      color: #333;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      padding: 12px 20px;
      border: none;
      background: #4CAF50;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #45a049;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h3 {
      margin: 0 0 10px;
      color: #222;
    }

    .meta {
      font-size: 14px;
      color: #666;
      margin-bottom: 5px;
    }

    .link {
      display: inline-block;
      margin-top: 10px;
      color: #2196F3;
      text-decoration: none;
      font-weight: bold;
    }

    .link:hover {
      text-decoration: underline;
    }

    .empty {
      text-align: center;
      color: #999;
      margin-top: 30px;
    }

    .error {
      text-align: center;
      color: red;
    }

    .loading {
      text-align: center;
      color: #555;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>🔍 Event Search</h2>

  <div class="search-box">
    <input type="text" id="searchBox" placeholder="Search by title or ID..." />
    <button onclick="search()">Search</button>
  </div>

  <div id="results"></div>
</div>

<script>
function toEventbriteSlug(title) {
  return title
    .toLowerCase()
    .trim()
    .replace(/&/g, "and")
    .replace(/[^a-z0-9\s-]/g, "")
    .replace(/\s+/g, "-")
    .replace(/-+/g, "-")
    .replace(/^-|-$/g, "");
}

async function search() {
  const query = document.getElementById("searchBox").value;
  const container = document.getElementById("results");

  if (!query) {
    container.innerHTML = "<p class='empty'>Enter something to search</p>";
    return;
  }

  // 🔥 Convert title → slug
  const slug = toEventbriteSlug(query);

  // 🌍 Try multiple locations
  const locations = [
    "online",
    "united-states",
    "india",
    "united-kingdom"
  ];

  // 🔗 Generate URLs
  const urls = locations.map(loc =>
    `https://www.eventbrite.com/d/${loc}/${slug}/`
  );

  // 👇 Show URLs to user
  container.innerHTML = `
    <p><b>🔗 Generated Search URLs:</b></p>
    ${urls.map(u => `<a href="${u}" target="_blank">${u}</a><br>`).join("")}
    <hr/>
    <p class="loading">⏳ Searching database...</p>
  `;

  const BASE_URL = window.location.origin;

  try {
    // 🔍 First search DB
    const res = await fetch(`${BASE_URL}/search?q=${query}`);
    const text = await res.text();

let data;

try {
  data = JSON.parse(text);
} catch (e) {
  console.error("❌ Not JSON response:", text);
  container.innerHTML += `<p class="error">❌ API returned HTML (check backend)</p>`;
  return;
}

    if (data.length > 0) {
      renderResults(data);
      return;
    }

    // ❌ Not found → call backend fallback (slug-based)
    const fallback = await fetch(`${BASE_URL}/fetch-from-eventbrite?slug=${slug}`);
    const newData = await fallback.json();

    if (newData.length === 0) {
      container.innerHTML += `<p class='empty'>❌ No events found anywhere</p>`;
      return;
    }

    renderResults(newData);

  } catch (err) {
    console.error(err);
    container.innerHTML = "<p class='error'>❌ Failed to fetch data</p>";
  }
}
</script>

</body>
</html>
